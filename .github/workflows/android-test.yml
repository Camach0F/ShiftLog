name: Test on Android emulator

# Manual run (Actions tab -> Run workflow). Builds the app, installs it on an Android emulator
# (a phone and a landscape tablet), walks through the main screens and uploads the screenshots
# and the device log as artifacts.
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Fill the app with example data and take the README screenshots
        type: boolean
        default: false

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # The emulator runs x86_64; Gradle signs the release build with a debug key, which is fine here.
      - name: Build the APK for the emulator
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_6
          - name: tablet
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: test-apk

      - name: Install Maestro
        run: |
          base="https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION"
          curl -fsSL -o maestro.zip "$base/maestro.zip"
          curl -fsSL "$base/checksums_sha256.txt" | grep ' maestro.zip$' | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: SCREENSHOTS=${{ inputs.screenshots && '1' || '0' }} ./scripts/emulator-test.sh ${{ matrix.name }} app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.name }}
          path: test-output/${{ matrix.name }}
