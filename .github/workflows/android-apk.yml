name: Build Android APK

# Manual run (Actions tab -> Run workflow): leaves the APK as a downloadable artifact.
# Pushing a tag such as v1.0.1: also publishes it as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Check the signing secrets exist
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name. Run scripts/create-signing-key.sh once (its header explains what it does)."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The version comes from the tag (v1.2.3 -> 1.2.3) or app.json; versionCode grows with every run.
      - name: Set the app version
        run: |
          VERSION=$(jq -r .expo.version app.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          jq --arg v "$VERSION" --argjson code "$GITHUB_RUN_NUMBER" \
            '.expo.version = $v | .expo.android.versionCode = $code' app.json > app.tmp
          mv app.tmp app.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Gradle signs release builds with a debug key; re-sign with our own so updates install over each other.
      - name: Sign the APK
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "ShiftLog-$VERSION.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "ShiftLog-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftLog-${{ env.VERSION }}
          path: ShiftLog-${{ env.VERSION }}.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ShiftLog-$VERSION.apk" \
            --title "ShiftLog $VERSION" --generate-notes
