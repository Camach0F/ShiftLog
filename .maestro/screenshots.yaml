# Fills the app with example data and takes the screenshots used in the README.
# Days 8 to 22 are used because they never repeat in the month grid (the leading and trailing
# days of the neighbouring months are 1-6 and 23-31).
appId: com.camach0f.shiftlog
---
- launchApp:
    clearState: true
    # The app asks for it after the guide; granting it here keeps the dialog out of the way
    permissions:
      notifications: allow
# The guide opens by itself on a fresh install: a screenshot of its second step, then skip it
- extendedWaitUntil:
    visible: "Te damos la bienvenida a ShiftLog"
    timeout: 20000
- tapOn: "Siguiente"
- extendedWaitUntil:
    visible: "1. Crea tu trabajo"
    timeout: 10000
- takeScreenshot: shot-guia
- tapOn: "Saltar guía"

# Two jobs from templates
- tapOn: "Trabajos"
- tapOn: "Nuevo trabajo"
- tapOn: "Turnos rotativos"
- tapOn: "Sin tarifa"
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Mañana"
- pressKey: back
- tapOn: "Nuevo trabajo"
- tapOn: "Hostelería"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back

# Two categories, one job in each (on the category page, tapping a job moves it there)
- tapOn: "Nueva categoría"
- tapOn: "Hostelería, Clientes.*"
- inputText: "Trabajo principal"
- hideKeyboard
- tapOn: "Guardar"
- tapOn: "Turnos rotativos"
- pressKey: back
- tapOn: "Nueva categoría"
- tapOn: "Hostelería, Clientes.*"
- inputText: "Extras"
- hideKeyboard
- tapOn: "Guardar"
- tapOn: "Hostelería"
- pressKey: back

# Shifts on the calendar
- tapOn: "Turnos"
- tapOn: "8"
- tapOn: "Mañana"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "9"
- tapOn: "Mañana"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "10"
- tapOn: "Tarde"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "13"
- tapOn: "Noche"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "14"
- tapOn: "Cena"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "15"
- tapOn: "Cena"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "16"
- tapOn: "Comida"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "20"
- tapOn: "Mañana"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "21"
- tapOn: "Tarde"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- tapOn: "22"
- tapOn: "Comida"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- pressKey: back
- takeScreenshot: shot-turnos

# Agenda
- tapOn: "Agenda"
- tapOn: "Nuevo evento"
- tapOn: "Médico"
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- takeScreenshot: shot-agenda

# Summary and jobs
- tapOn: "Resumen"
- takeScreenshot: shot-resumen
# The report card of a category has its own PDF button, which opens the dialog on that category
- scrollUntilVisible:
    element: "Generar el PDF de Trabajo principal"
- tapOn: "Generar el PDF de Trabajo principal"
- assertVisible: "Generar PDF"
- takeScreenshot: shot-pdf-categoria
- tapOn: "Cancelar"
- tapOn: "Trabajos"
- takeScreenshot: shot-trabajos
