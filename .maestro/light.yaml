# Walks through the app in light mode: create a job paid per job, add a shift to the calendar,
# check the summary and exports, and look for updates.
appId: com.camach0f.shiftlog
---
- launchApp:
    clearState: true
- assertVisible: "Agenda"
# The test build calls itself 0.9.0, so the published release is an update
- extendedWaitUntil:
    visible: "Instalar"
    timeout: 20000
- assertVisible: "Hay una actualización.*"
- takeScreenshot: 01-agenda

# New job from a template, paid per job
- tapOn: "Trabajos"
- takeScreenshot: 02-trabajos
- tapOn: "Nuevo trabajo"
- tapOn: "Oficina"
- tapOn: "Por trabajo"
- tapOn: "Sin precio"
- inputText: "50"
- hideKeyboard
- takeScreenshot: 03-trabajo-nuevo
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- assertVisible: "Jornada"
- takeScreenshot: 04-trabajo-guardado

# Shift type form and the native time picker
- scrollUntilVisible:
    element: "Nuevo tipo de turno"
- tapOn: "Nuevo tipo de turno"
- takeScreenshot: 05-tipo-turno
- tapOn:
    text: "Elegir entrada"
    optional: true
- takeScreenshot: 06-selector-hora
- pressKey: back
- pressKey: back
- takeScreenshot: 07-trabajo
- pressKey: back
- takeScreenshot: 07b-despues-de-volver

# Add a shift to the 15th of the current month
- tapOn: "Turnos"
- takeScreenshot: 08-turnos
- tapOn: "15"
- takeScreenshot: 09-dia
- tapOn: "Jornada"
- takeScreenshot: 10-turno
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- takeScreenshot: 11-dia-con-turno
- pressKey: back

# Summary: one fixed-price job should add up to 50.00
- tapOn: "Resumen"
- assertVisible: "50.00 €"
- takeScreenshot: 12-resumen
- tapOn: "PDF"
- assertVisible: "Generar PDF"
- takeScreenshot: 13-pdf-opciones
- tapOn: "Generar PDF"
# The share sheet opens (no error alert)
- waitForAnimationToEnd:
    timeout: 8000
- assertNotVisible: "No se pudo exportar"
- takeScreenshot: 13b-pdf
- pressKey: back
- tapOn:
    text: "CSV.*"
    optional: true
- takeScreenshot: 14-csv
- pressKey: back

# Settings: updates
- tapOn: "Trabajos"
# The last button of the page first, so the card above it is on screen (also on a tablet)
- scrollUntilVisible:
    element: "Ver novedades de esta versión"
# The test build is older than the latest release, so the card shows the new version.
- extendedWaitUntil:
    visible: "Hay una versión nueva.*|Versión.*"
    timeout: 15000
- takeScreenshot: 15-actualizaciones

# What's new popup, opened by hand: the changes, the Discord button and Accept
- tapOn: "Ver novedades de esta versión"
- assertVisible: "Novedades de la versión.*"
- assertVisible: "Unirme al Discord"
- takeScreenshot: 16-novedades
- tapOn: "Aceptar"
- assertNotVisible: "Unirme al Discord"
