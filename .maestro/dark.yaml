# The same screens in dark mode (the workflow switches the emulator to night mode first).
appId: com.camach0f.shiftlog
---
# The app is started again if it never shows
- retry:
    maxRetries: 3
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: "Agenda"
          timeout: 20000
- assertVisible: "Agenda"
- takeScreenshot: dark-01-agenda
- tapOn: "Turnos"
- takeScreenshot: dark-02-turnos
- tapOn: "Resumen"
- takeScreenshot: dark-03-resumen
- tapOn: "Trabajos"
- takeScreenshot: dark-04-trabajos
