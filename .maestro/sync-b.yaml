# Calendar sync, part 2: editing and deleting agenda events must reach the calendar.
appId: com.camach0f.shiftlog
---
- launchApp
- tapOn: "Agenda"
# The events of the day are below the calendar
- scrollUntilVisible:
    element: "Todo el día"
- tapOn: "Todo el día"
- tapOn: "Opcional"
- inputText: "Con tarta"
- hideKeyboard
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- scrollUntilVisible:
    element: "10:00 – 11:00"
- tapOn: "10:00 – 11:00"
- scrollUntilVisible:
    element: "Eliminar evento"
- tapOn: "Eliminar evento"
- assertNotVisible: "10:00 – 11:00"
