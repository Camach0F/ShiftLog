# Calendar sync, part 2: editing and deleting agenda events must reach the calendar.
appId: com.camach0f.shiftlog
---
# The app is started again if it never shows
- retry:
    maxRetries: 3
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: "Agenda"
          timeout: 20000
- tapOn: "Agenda"
# The events of the day are below the calendar
- scrollUntilVisible:
    element: "Todo el día"
- tapOn: "Todo el día"
- tapOn: "Opcional"
- inputText: "Con tarta"
- hideKeyboard
- scrollUntilVisible:
    element: "Guardar"
- tapOn: "Guardar"
- scrollUntilVisible:
    element: "10:00 – 11:00"
- tapOn: "10:00 – 11:00"
- scrollUntilVisible:
    element: "Eliminar evento"
- tapOn: "Eliminar evento"
# Back on the agenda (the editor has fields with a 10:00 of their own), and the event is gone
- assertVisible: "Nuevo evento"
- assertNotVisible: "10:00 – 11:00"
